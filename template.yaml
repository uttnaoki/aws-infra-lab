AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Infra Notes - authenticated learning API
Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
  Client:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      IdTokenValidity: 1
      TokenValidityUnits:
        IdToken: hours
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins: ['http://127.0.0.1:8080']
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST]
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      Auth:
        DefaultAuthorizer: Cognito
        Authorizers:
          Cognito:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              audience: [!Ref Client]
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
  Notes:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: owner
          AttributeType: S
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: owner
          KeyType: HASH
        - AttributeName: id
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
  Function:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: app/
      Handler: handler.handler
      Runtime: python3.13
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref Notes
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: ['dynamodb:Query', 'dynamodb:PutItem']
              Resource: !GetAtt Notes.Arn
      Events:
        List:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /notes
            Method: GET
        Create:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /notes
            Method: POST
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Function}'
      RetentionInDays: 7
Outputs:
  ApiUrl:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com'
  UserPoolId:
    Value: !Ref UserPool
  ClientId:
    Value: !Ref Client
